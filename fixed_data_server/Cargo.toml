[package]
name = "fixed_data_server"
version = "0.1.0"
edition = "2021"

[lib]
name = "fixed_data_server"
path = "src/lib.rs"

[[bin]]
name = "fixed_data_server"
path = "src/main.rs"

[dependencies]
# tonicが要求するaxum 0.7.9に合わせる
axum = "0.7.9"
tokio = { version = "1.45", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "bigdecimal"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"

# gRPC dependencies for admin_backend integration
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
webpki-roots = "0.26"
rustls-native-certs = "0.8"

# 共有モジュールを使用
models = { path = "../shared/models" }
feature = { path = "../shared/feature" }
analyzer = { path = "../analyzer" }

[build-dependencies]
tonic-build = "0.12"